r 28, 2026 note.","photo_credit":"Official White House photograph by Daniel Torok, May 22, 2026. Public domain (US federal government). Commons crop; no further edits.","photo_less_brief_eligible":false,"primary_reader_question":"What did the Fed agree to hold on October 28, where did the two dissenters disagree, and how is that policy choice different from the rates used to implement it?","public_source_bindings":[{"published_at_utc":"2026-10-28T18:00:00Z","publisher":"Federal Reserve Board","reader_label":"Federal Reserve Board · 2026-10-28","source_id":"SOURCE_1","url":"https://www.federalreserve.gov/newsevents/pressreleases/monetary20261028a.htm"},{"published_at_utc":"2026-10-28T18:00:00Z","publisher":"Federal Reserve Board","reader_label":"Federal Reserve Board · 2026-10-28","source_id":"SOURCE_2","url":"https://www.federalreserve.gov/newsevents/pressreleases/monetary20261028a1.htm"}],"public_write_performed":false,"publisher_identity":"Capital Chronicle","reader_attribution_policy":"CONTENTOPS_V1_READER_ATTRIBUTION_AND_TIMEZONE_POLICY_V1","reader_first_version":"DATA_JOURNALISM_V1","resolved_article_mode":"DATA_OR_DOCUMENT_LENS","schema_version":"contentops.v1_simple_article_manifest.v1","search_freshness_class":"EVERGREEN","search_title":"October 28, 2026 Fed hold: vote and operating rates explained","secondary_reader_questions":["Which direction did the two FOMC dissenters favor?","Why is interest on reserve balances different from the federal funds target range?","What can the recorded vote establish about a later decision?"],"seo_title":"October 28, 2026 Fed hold: vote and operating rates explained","slug":"october-28-fed-hold-vote-operating-rates","social_cross_asset_summary":"The next useful question is whether a later Committee decision changes the target range or the direction of the recorded vote. The October 28 documents should be read as that meeting's decision and implementation instructions, rather than a prediction of what comes next.","social_hook":"The Fed's October 28 hold was a 10-2 decision. Both dissenters wanted higher rates.","social_lede":"The Fed's October 28 hold was a 10-2 decision. Both dissenters wanted higher rates.","social_mechanism_summary":"Capital Chronicle's reading is that the decision and its implementation answer different questions. The vote establishes the target range and the direction of disagreement. The companion note sets out the rates and instructions used to implement that stance. A reader needs both documents to distinguish the policy choice from its operating settings.","social_policy_summary":"The strongest countercase to a looming-hike interpretation is the decision itself: ten members approved keeping the range unchanged. The two dissenters' preference is evidence of disagreement at this meeting, not a forecast of the next vote. Reading the split as a timetable for higher rates would give it a meaning the vote alone cannot establish.","source_clock_metadata":{"historical_facts_cutoff_utc":"2026-10-28T19:14:31.428086Z","implementation_observed_utc":"2026-10-28T19:13:00.161Z","new_factual_evidence_acquired":false,"official_publication_utc":"2026-10-28T18:00:00Z","operation_cutoff_utc":"2026-11-01T05:13:41.397188Z","original_first_print_verified":false,"source_snapshot_status":"RETAINED_BEFORE_HISTORICAL_CUTOFF","statement_observed_utc":"2026-10-28T19:12:15.347Z"},"source_date_notice":"Source date: 2026-10-28. Interpretation remains analysis.","source_document_ids":["cc074-fomc-20261028-statement","cc074-fomc-20261028-implementation"],"story_identity":"simple-story-06edc3ce5772f6cef827854f","story_kind":"ANALYSIS","structured_data_packet":null,"substack_body_markdown":"*Retrospective analysis, written on 1 November 2026 (GMT+7).*\n\nAn unchanged rate can still contain a pointed disagreement. On October 28, 2026, the Federal Reserve's policy committee voted 10-2 to keep the federal funds target range at 3.75 to 4 percent, according to its [October 28 statement](https://www.federalreserve.gov/newsevents/pressreleases/monetary20261028a.htm). Both dissenters wanted a quarter-percentage-point increase.\n\nCapital Chronicle's reading is that the decision and its implementation answer different questions. The vote establishes the target range and the direction of disagreement. The companion note sets out the rates and instructions used to implement that stance. A reader needs both documents to distinguish the policy choice from its operating settings.\n\n## A hold with dissent in one direction\n\nLisa D. Cook and Beth M. Hammack voted against the action because they preferred to raise the target range by a quarter percentage point at that meeting. That makes the direction of dissent clear: they favored an increase, while the approved action maintained the range.\n\nThe statement described economic activity as expanding strongly, domestic spending as resilient and inflation as elevated. It also said accumulating more information would help the Committee determine the stance appropriate for a timely return to its 2 percent inflation goal. That is the Committee's published assessment; it should not be turned into a separate explanation attributed to either dissenter.\n\nThe strongest countercase to a looming-hike interpretation is the decision itself: ten members approved keeping the range unchanged. The two dissenters' preference is evidence of disagreement at this meeting, not a forecast of the next vote. Reading the split as a timetable for higher rates would give it a meaning the vote alone cannot establish.\n\n## One target range, several operating rates\n\nThe [companion implementation note](https://www.federalreserve.gov/newsevents/pressreleases/monetary20261028a1.htm) describes decisions to carry out the October 28 policy stance. The Board of Governors unanimously maintained interest paid on reserve balances at 3.90 percent, effective October 29. The directive to the New York Fed's trading desk, also effective October 29, instructed it to undertake operations as necessary to maintain the federal funds rate within the 3.75 to 4 percent target range.\n\nThe same directive set standing overnight repo operations at 4.0 percent and the standing overnight reverse repo offering rate at 3.75 percent. In a related action, the Board unanimously approved the primary credit rate at its existing 4.0 percent level. The note therefore assigns some identical numbers to different instruments; it does not combine those instruments into a single rate.\n\nThe 3.90 percent reserve-balances setting is not a substitute label for the 3.75 to 4 percent federal funds target range. One is an individual rate; the other is the interval the desk is instructed to maintain. Likewise, unanimous Board actions on reserve interest and primary credit should not be mistaken for unanimity in the 10-2 FOMC decision.\n\nThese are announced settings, not observations of the rates at which market transactions actually took place. The chart compares their stated levels and roles. It should not be read as a record of market repricing or as a measure of how effectively the instruments transmitted the decision.\n\n## What to watch in a later decision\n\nThe next useful question is whether a later Committee decision changes the target range or the direction of the recorded vote. The October 28 documents should be read as that meeting's decision and implementation instructions, rather than a prediction of what comes next.\n\n*Analysis, not financial advice. Readers decide whether to trade.* ","subtitle":"A 10-2 vote kept the federal funds target at 3.75 to 4 percent. The dissenters wanted an increase; the companion note explains the operating settings.","title":"The Fed held on October 28. Both dissenters wanted a hike.","topics":["October 2026 FOMC decision","Monetary policy","Federal funds target range","Policy implementation"],"update_chain_identity":"simple-story-06edc3ce5772f6cef827854f","visual_editorial_decision":{"channel_media":{"disco .v1_simple_epistemic_state.v1","selected_route":"OFFICIAL_PRIMARY","source_multiplicity":"SINGLE_SOURCE","supporting_document_ids":["cc074-fomc-20261028-statement"],"underlying_event_may_be_stated_as_confirmed":true},"evidence":[{"browser_rendered_acquisition":null,"canonical_content_sha256":"97cfd01ed6a111e97f890e3571e16940206827649baa637c876905ffbb3560bc","canonical_content_text":"The Committee decided to maintain the target range for the federal funds rate at 3-3/4 to 4 percent, in support of the Federal Reserve's dual mandate.\n\nHome News & Events Press Releases Press Release PDF October 28, 2026 Federal Reserve issues FOMC statement For release at 2:00 p.m. EDT Share The Federal Open Market Committee approved the following statement for release by a 10 – 2 vote:\n\nThe Committee is continuing its policy of maintaining ample reserves in the banking system. Economic activity is expanding at a strong pace. While uncertainty remains elevated owing, in part, to geopolitical developments, domestic spending has been resilient. Productivity growth is strong, and capital investment is robust. Job gains have kept pace with the workforce, and the unemployment rate has changed little. Inflation remains elevated. The accumulation of more information will help the Committee determine the policy stance appropriate to ensure a timely return of inflation to the Committee's 2 percent goal. The Committee will deliver price stability. Voting against the monetary policy action were Lisa D. Cook and Beth M. Hammack, who preferred to raise the target range for the federal funds rate by 1/4 percentage point at this meeting. For media inquiries, please email media@frb.gov or call 202-452-2955. Implementation Note issued October 28, 2026 Last Update: October 28, 2026","canonical_resolution_status":"","document_id":"cc074-fomc-20261028-statement","published_at_source":"OFFICIAL_RELEASE_2PM_EDT_20261028_STATEMENT_AND_LINKED_IMPLEMENTATION_NOTE","published_at_utc":"2026-10-28T18:00:00Z","publisher":"Federal Reserve Board","report_truth_only":false,"retrieval_method":"RETAINED_OFFICIAL_PERMITTED_TEXT_SPANS","rights_evidence_sha256":"1c73239bc905e992abf6e5d8e73acaa67f6ce8b67c3d3848ef8606708bf690a8","secondary_listing_only":false,"source_authority_class":"official_public_primary_source","source_id":"SOURCE_1","source_identity":"Federal Reserve Board","underlying_reuse_classification":"governed_government_public_domain","url":"https://www.federalreserve.gov/newsevents/pressreleases/monetary20261028a.htm"},{"browser_rendered_acquisition":null,"canonical_content_sha256":"9287c9f882db7a20b4d69242fdad3999e1aaa01d16749e9cadd5806999ad77d0","canonical_content_text":"The Board of Governors of the Federal Reserve System voted unanimously to maintain the interest rate paid on reserve balances at 3.90 percent, effective October 29, 2026.\n\nHome News & Events Press Releases Federal Reserve issues FOMC statement Press Release October 28, 2026 Implementation Note issued October 28, 2026 Decisions Regarding Monetary Policy Implementation The Federal Reserve has made the following decisions to implement the monetary policy stance announced by the Federal Open Market Committee in its statement on October 28, 2026:\n\nAs part of its policy decision, the Federal Open Market Committee voted to direct the Open Market Desk at the Federal Reserve Bank of New York, until instructed otherwise, to execute transactions in the System Open Market Account in accordance with the following domestic policy directive: \"Effective October 29, 2026, the Federal Open Market Committee directs the Desk to: Undertake open market operations as necessary to maintain the federal funds rate in a target range of 3-3/4 to 4 percent. Conduct standing overnight repurchase agreement operations at a rate of 4.0 percent. Conduct standing overnight reverse repurchase agreement operations at an offering rate of 3.75 percent and with a per-counterparty limit of $160 billion per day. When appropriate, increase the System Open Market Account holdings of securities through purchases of Treasury bills and, if needed, other Treasury securities with remaining maturities of 3 years or less to maintain an ample level of reserves. Roll over at auction all principal payments from the Federal Reserve's holdings of Treasury securities. Reinvest all principal payments from the Federal Reserve's holdings of agency securities into Treasury bills.\" In a related action, the Board of Governors of the Federal Reserve System voted unanimously to approve the establishment of the primary credit rate at the existing level of 4.0 percent. This information will be updated as appropriate to reflect decisions of the Federal Open Market Committee or the Board of Governors regarding details of the Federal Reserve's operational tools and approach used to implement monetary policy. More information regarding open market operations and reinvestments may be found on the Federal Reserve Bank of New York's website. Last Update: October 28, 2026","canonical_resolution_status":"","context_only":true,"document_id":"cc074-fomc-20261028-implementation","known_at_utc":"2026-10-28T19:13:00.161Z","published_at_source":"OFFICIAL_RELEASE_2PM_EDT_20261028_STATEMENT_AND_LINKED_IMPLEMENTATION_NOTE","published_at_utc":"2026-10-28T18:00:00Z","publisher":"Federal Reserve Board","report_truth_only":false,"retrieval_method":"RETAINED_OFFICIAL_PERMITTED_CONTEXT_SPANS","secondary_listing_only":false,"source_authority_class":"official_public_primary_source","source_id":"SOURCE_2","source_identity":"Federal Reserve Board","url":"https://www.federalreserve.gov/newsevents/pressreleases/monetary20261028a1.htm"}],"media_assets":[{"alt_text":"Archive portrait of Kevin Warsh in a navy suit at his May 22, 2026 swearing-in ceremony.","asset_id":"cc074-archive-warsh-20260522","attribution":"Official White House photograph by Daniel Torok, May 22, 2026. Public domain (US federal government). Commons crop; no further edits.","capti _status":"attributed_facts_independent_chart","visual_review":{"asset_sha256":"4110ee29075a70c5ef1fde96342c2a3405c4c4b9394f76b4357b409b431e3789","labels_and_units_legible":true,"pixels_inspected":true,"reviewer":"Parent actual view_image inspection of exact PNG, 1 November2026. Counts10/2, zero-based member axis; target interval3.75-4 and exact individual operating settings. Final same-MAX rendered review pending."},"width":1500},{"alt_text":"Announced October 28, 2026: federal funds target interval 3.75 to 4.00 percent; reserve interest 3.90; standing overnight reverse repo 3.75; standing overnight repo 4.00; existing primary credit 4.00. These are announced settings, not observed market rates. Reserve interest and the operating directive effective October 29.","asset_id":"cc074-fomc-20261028-rate-framework","attribution":"Source: Federal Reserve Board, October 28, 2026 FOMC statement and implementation note.","caption":"The target range and individual operating settings announced October 28. Reserve interest and the operating directive were effective October 29; primary credit was at its existing level.","caption_revision":"SAME_WRITER_FINAL_VISUAL_REPAIR_V2","computed_values":[[3.75],[4.0],[3.9],[3.75],[4.0],[4.0]],"destination_subset":["discord","linkedin","facebook_page","instagram_business"],"editorial_data_packet":{"alt_text":"Which announced rates define the target band, and which are settings for separate operating instruments?","asset_id":"cc074-fomc-20261028-rate-framework","caption":"A shared-rate-axis comparison makes the target interval visually distinct from the individual administered settings. It prevents the 3.90 percent reserve-balances rate from being mistaken for the federal funds target or an observed market rate, and it shows that equal numeric settings can belong to different instruments.","chart_type":"horizontal_interval_and_points","destination_subset":["discord","linkedin","facebook_page","instagram_business"],"missingness":"NO_VALUES_FILLED_OR_INTERPOLATED","native_visual_request_sha256":"266e6978a4ecafa0469f451f68fcf37c48a8456529c20dedc03abf1abb850d1d","placement_after":"One target range, several operating rates","question":"Which announced rates define the target band, and which are settings for separate operating instruments?","range_series_ids":["FOMC_20261028_TARGET_LOWER","FOMC_20261028_TARGET_UPPER"],"series":[{"label":"Federal funds target range","points":[{"inputs":[{"document_id":"cc074-fomc-20261028-statement","metric":"Target-range lower endpoint","period_basis":"EXACT_DATED_ANNOUNCEMENT_NOT_REALIZED_MARKET_DATA","prepared_period":"2026-10-28","source_content_sha256":"97cfd01ed6a111e97f890e3571e16940206827649baa637c876905ffbb3560bc","source_numeric_format":"EXACT_FRACTION","source_period_text":"October 28, 2026","support_excerpt":"The Committee decided to maintain the target range for the federal funds rate at 3-3/4 to 4 percent, in support of the Federal Reserve's dual mandate.\n\nHome News & Events Press Releases Press Release PDF October 28, 2026 Federal Reserve issues FOMC statement For release at 2:00 p.m. EDT Share The Federal Open Market Committee approved the following statement for release by a 10 – 2 vote:\n\nThe Committee is continuing its policy of maintaining ample reserves in the banking system. Economic activity is expanding at a strong pace. While uncertainty remains elevated owing, in part, to geopolitical developments, domestic spending has been resilient. Productivity growth is strong, and capital investment is robust. Job gains have kept pace with the workforce, and the unemployment rate has changed little. Inflation remains elevated. The accumulation of more information will help the Committee determine the policy stance appropriate to ensure a timely return of inflation to the Committee's 2 percent goal. The Committee will deliver price stability. Voting against the monetary policy action were Lisa D. Cook and Beth M. Hammack, who preferred to raise the target range for the federal funds rate by 1/4 percentage point at this meeting. For media inquiries, please email media@frb.gov or call 202-452-2955. Implementation Note issued October 28, 2026 Last Update: October 28, 2026","unit":"percent","value_text":"3-3/4"}],"observation_kind":"ANNOUNCED_POLICY","period":"Federal funds target range","transform":"IDENTITY","value":3.75}],"series_id":"FOMC_20261028_TARGET_LOWER"},{"label":"Federal funds target range","points":[{"inputs":[{"document_id":"cc074-fomc-20261028-statement","metric":"Target-range upper endpoint","period_basis":"EXACT_DATED_ANNOUNCEMENT_NOT_REALIZED_MARKET_DATA","prepared_period":"2026-10-28","source_content_sha256":"97cfd01ed6a111e97f890e3571e16940206827649baa637c876905ffbb3560bc","source_period_text":"October 28, 2026","support_excerpt":"The Committee decided to maintain the target range for the federal funds rate at 3-3/4 to 4 percent, in support of the Federal Reserve's dual mandate.\n\nHome News & Events Press Releases Press Release PDF October 28, 2026 Federal Reserve issues FOMC statement For release at 2:00 p.m. EDT Share The Federal Open Market Committee approved the following statement for release by a 10 – 2 vote:\n\nThe Committee is continuing its policy of maintaining ample reserves in the banking system. Economic activity is expanding at a strong pace. While uncertainty remains elevated owing, in part, to geopolitical developments, domestic spending has been resilient. Productivity growth is strong, and capital investment is robust. Job gains have kept pace with the workforce, and the unemployment rate has changed little. Inflation remains elevated. The accumulation of more information will help the Committee determine the policy stance appropriate to ensure a timely return of inflation to the Committee's 2 percent goal. The Committee will deliver price stability. Voting against the monetary policy action were Lisa D. Cook and Beth M. Hammack, who preferred to raise the target range for the federal funds rate by 1/4 percentage point at this meeting. For media inquiries, please email media@frb.gov or call 202-452-2955. Implementation Note issued October 28, 2026 Last Update: October 28, 2026","unit":"percent","value_text":"4"}],"observation_kind":"ANNOUNCED_POLICY","period":"Federal funds target range","transform":"IDENTITY","value":4.0}],"series_id":"FOMC_20261028_TARGET_UPPER"},{"label":"Interest on reserve balances","points":[{"inputs":[{"document_id":"cc074-fomc-20261028-implementation","metric":"Interest paid on reserve balances","period_basis":"EXACT_DATED_ANNOUNCEMENT_NOT_REALIZED_MARKET_DATA","prepared_period":"2026-10-28","source_content_sha256":"9287c9f882db7a20b4d69242fdad3999e1aaa01d16749e9cadd5806999ad77d0","source_period_text":"October 28, 2026","support_excerpt":"The Board of Governors of the Federal Reserve System voted unanimously to maintain the interest rate paid on reserve balances at 3.90 percent, effective October 29, 2026.\n\nHome News & Events Press Releases Federal Reserve issues FOMC statement Press Release October 28, 2026 Implementation Note issued October 28, 2026 Decisions Regarding Monetary Policy Implementation The Federal Reserve has made the following decisions to implement the monetary policy stance announced by the Federal Open Market Committee in its statement on October 28, 2026:\n\nAs part of its policy decision, the Federal Open Market Committee voted to direct the Open Market Desk at the Federal Reserve Bank of New York, until instructed otherwise, to execute transactions in the System Open Market Account in accordance with the following domestic policy directive: \"Effective October 29, 2026, the Federal Open Market Committee directs the Desk to: Undertake open market operations as necessary to maintain the federal funds rate in a target range of 3-3/4 to 4 percent. Conduct standing overnight repurchase agreement operations at a rate of 4.0 percent. Conduct standing overnight reverse repurchase agreement operations at an offering rate of 3.75 percent and with a per-counterparty limit of $160 billion per day. When appropriate, increase the System Open Market Account holdings of securities through purchases of Treasury bills and, if needed, other Treasury securities with remaining maturities of 3 years or less to maintain an ample level of reserves. Roll over at auction all principal payments from the Federal Reserve's holdings of Treasury securities. Reinvest all principal payments from the Federal Reserve's holdings of agency securities into Treasury bills.\" In a related action, the Board of Governors of the Federal Reserve System voted unanimously to approve the establishment of the primary credit rate at the existing level of 4.0 percent. This information will be updated as appropriate to reflect decisions of the Federal Open Market Committee or the Board of Governors regarding details of the Federal Reserve's operational tools and approach used to implement monetary policy. More information regarding open market operations and reinvestments may be found on the Federal Reserve Bank of New York's website. Last Update: October 28, 2026","unit":"percent","value_text":"3.90"}],"observation_kind":"ANNOUNCED_POLICY","period":"Interest on reserve balances","transform":"IDENTITY","value":3.9}],"series_id":"FOMC_20261028_IORB"},{"label":"Standing overnight reverse repo","points":[{"inputs":[{"document_id":"cc074-fomc-20261028-implementation","metric":"Overnight reverse repo offering rate","period_basis":"EXACT_DATED_ANNOUNCEMENT_NOT_REALIZED_MARKET_DATA","prepared_period":"2026-10-28","source_content_sha256":"9287c9f882db7a20b4d69242fdad3999e1aaa01d16749e9cadd5806999ad77d0","source_period_text":"October 28, 2026","support_excerpt":"The Board of Governors of the Federal Reserve System voted unanimously to maintain the interest rate paid on reserve balances at 3.90 percent, effective October 29, 2026.\n\nHome News & Events Press Releases Federal Reserve issues FOMC statement Press Release
