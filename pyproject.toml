[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-live-contentops"
version = "0.0.1"
description = "Capital Chronicle Live ContentOps Control Plane Skeleton"
[project.scripts]
cc-discord-operator-send = "live_contentops.discord_operator_send_cli:main"
cc-telegram-operator-send = "live_contentops.telegram_operator_send_cli:main"

[tool.pytest.ini_options]
norecursedirs = [".git", "docs", "ui", "node_modules", "project_sources_bundle_AFTER_DISCORD_PRE_LIVE_READINESS"]
testpaths = ["tests"]

