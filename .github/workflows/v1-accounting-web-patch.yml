name: v1-accounting-web-patch

on:
  push:
    branches:
      - 'agent/web-v1-reconciled-published-count-accounting-v1'
    paths:
      - '.github/workflows/v1-accounting-web-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/web-v1-reconciled-published-count-accounting-v1
          fetch-depth: 0

      - name: Apply bounded published-accounting changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one target, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          # Canonical read model: expose the already-existing strict lifecycle contract as a
          # reusable projection predicate. This does not create a new query/store/ledger.
          path = 'live_contentops/published_corpus_read_model_v1.py'
          replace_once(
              path,
              '''CONTENT_AVAILABLE = "CONTENT_AVAILABLE"\nCONTENT_UNAVAILABLE = "CONTENT_UNAVAILABLE"\n''',
              '''CONTENT_AVAILABLE = "CONTENT_AVAILABLE"\nCONTENT_UNAVAILABLE = "CONTENT_UNAVAILABLE"\nCANONICAL_PUBLICATION_CONTRACT = (\n    "SUBSTACK_DISPATCH_CONFIRMED_AND_EXACT_RECONCILIATION_CONFIRMED_"\n    "AND_VALID_CANONICAL_URL"\n)\n''',
          )
          replace_once(
              path,
              '''def _artifact_article(output_dir: Optional[Path]) -> dict[str, Any]:\n''',
              '''def _field(value: Any, name: str) -> Any:\n    if isinstance(value, Mapping):\n        return value.get(name)\n    return getattr(value, name, None)\n\n\ndef is_countable_canonical_published_article(value: Any) -> bool:\n    """Validate the strict canonical read-model projection shape for live counting.\n\n    Lifecycle authority remains ``load_published_corpus``: it emits a projection only after\n    Substack ``DISPATCH_CONFIRMED`` + exact ``RECONCILED_CONFIRMED`` + valid readback. This\n    predicate prevents partial/arbitrary article refs from entering live production-day counts;\n    it does not duplicate durable lifecycle queries or grant publication authority.\n    """\n    identity = _field(value, "article_identity") or _field(value, "story_identity")\n    return bool(\n        str(identity or "").strip()\n        and str(_field(value, "published_at_utc") or "").strip()\n        and str(_field(value, "public_object_id") or "").strip()\n        and str(_field(value, "canonical_url_hash") or "").strip()\n        and str(_field(value, "source_work_item_id") or "").strip()\n        and _valid_canonical_substack_url(_field(value, "canonical_url"))\n    )\n\n\ndef _artifact_article(output_dir: Optional[Path]) -> dict[str, Any]:\n''',
          )
          replace_once(
              path,
              '''        "canonical_publication_contract": (\n            "SUBSTACK_DISPATCH_CONFIRMED_AND_EXACT_RECONCILIATION_CONFIRMED_AND_VALID_CANONICAL_URL"\n        ),\n''',
              '''        "canonical_publication_contract": CANONICAL_PUBLICATION_CONTRACT,\n''',
          )
          replace_once(
              path,
              '''        "canonical_reconciled_article_count": len(articles),\n        "store_access_mode": "SQLITE_MODE_RO_QUERY_ONLY",\n''',
              '''        "canonical_reconciled_article_count": len(articles),\n        "canonical_publication_contract": CANONICAL_PUBLICATION_CONTRACT,\n        "derived_from_existing_durable_truth": True,\n        "store_access_mode": "SQLITE_MODE_RO_QUERY_ONLY",\n''',
          )

          # Production-day projection: keep qualified deficit as telemetry, but live state and
          # pacing use only strict canonical reconciled publications.
          path = 'live_contentops/newsroom_production_day_v1.py'
          replace_once(
              path,
              '''from live_contentops.editorial_portfolio_v1 import PublishedArticleRef\n''',
              '''from live_contentops.editorial_portfolio_v1 import PublishedArticleRef\nfrom live_contentops.published_corpus_read_model_v1 import (\n    CANONICAL_PUBLICATION_CONTRACT,\n    is_countable_canonical_published_article,\n)\n''',
          )
          replace_once(
              path,
              '''ROUTINE_OPPORTUNITY_LIMIT = 4\n''',
              '''ROUTINE_OPPORTUNITY_LIMIT = 4\nLIVE_OUTPUT_COUNT_BASIS = CANONICAL_PUBLICATION_CONTRACT\n''',
          )
          replace_once(
              path,
              '''def bounded_deficit_work_needed(*, session: str, qualified_articles_today: int) -> int:\n    """Allocate bounded article slots without allowing quota pacing to starve a window.\n\n    Every valid routine opportunity gets at least one real candidate walk.  Below the final\n    five-article minimum, extra capacity is allocated when needed to keep that minimum reachable\n    through the later routine windows.  Qualification still depends on the normal governed\n    candidate, evidence, truth, and authority gates; this is capacity, never a filler quota.\n    """\n    if routine_session_ordinal(session) == 0:\n        return 0\n    qualified = max(0, int(qualified_articles_today))\n    if qualified >= FINAL_PUBLISHED_TARGET_MIN:\n        return 1\n    return max(\n        1,\n        FINAL_PUBLISHED_TARGET_MIN\n        - qualified\n        - remaining_future_routine_windows(session),\n    )\n''',
              '''def bounded_deficit_work_needed(\n    *,\n    session: str,\n    published_articles_today: Optional[int] = None,\n    qualified_articles_today: Optional[int] = None,\n) -> int:\n    """Allocate bounded article slots from strictly reconciled published output.\n\n    Every valid routine opportunity gets at least one real candidate walk. Below the final\n    five-published-article minimum, extra capacity keeps that minimum reachable through later\n    routine windows. ``qualified_articles_today`` is retained only as a legacy keyword shim for\n    historical callers/tests; current production callers MUST pass ``published_articles_today``.\n    Capacity never grants evidence, truth, or publication authority and never authorizes filler.\n    """\n    if routine_session_ordinal(session) == 0:\n        return 0\n    if published_articles_today is None:\n        if qualified_articles_today is None:\n            raise TypeError("published_articles_today_required")\n        published_articles_today = qualified_articles_today\n    published = max(0, int(published_articles_today))\n    if published >= FINAL_PUBLISHED_TARGET_MIN:\n        return 1\n    return max(\n        1,\n        FINAL_PUBLISHED_TARGET_MIN\n        - published\n        - remaining_future_routine_windows(session),\n    )\n''',
          )
          replace_once(
              path,
              '''def _published_count(\n    published_corpus: Sequence[Any], *, production_day_id: str\n) -> int:\n    identities: set[str] = set()\n    for value in published_corpus:\n        published_at = getattr(value, "published_at_utc", None)\n        identity = getattr(value, "article_identity", None) or getattr(\n            value, "story_identity", None\n        )\n        if not published_at or not identity:\n            continue\n        try:\n            if newsroom_production_day_id(str(published_at)) == production_day_id:\n                identities.add(str(identity))\n        except ValueError:\n            continue\n    return len(identities)\n''',
              '''def count_reconciled_published_articles(\n    published_corpus: Sequence[Any], *, production_day_id: str\n) -> int:\n    """Count only strict canonical published projections for one newsroom day."""\n    identities: set[str] = set()\n    for value in published_corpus:\n        if not is_countable_canonical_published_article(value):\n            continue\n        published_at = getattr(value, "published_at_utc", None)\n        identity = getattr(value, "article_identity", None) or getattr(\n            value, "story_identity", None\n        )\n        try:\n            if newsroom_production_day_id(str(published_at)) == production_day_id:\n                identities.add(str(identity))\n        except ValueError:\n            continue\n    return len(identities)\n''',
          )
          replace_once(
              path,
              '''    def to_dict(self) -> dict[str, Any]:\n        return asdict(self)\n''',
              '''    @property\n    def remaining_published_deficit(self) -> int:\n        return max(0, int(self.final_published_target_min) - int(self.published_articles_today))\n\n    @property\n    def live_output_count_basis(self) -> str:\n        return LIVE_OUTPUT_COUNT_BASIS\n\n    def to_dict(self) -> dict[str, Any]:\n        payload = asdict(self)\n        payload["remaining_published_deficit"] = self.remaining_published_deficit\n        payload["live_output_count_basis"] = self.live_output_count_basis\n        return payload\n''',
          )
          replace_once(
              path,
              '''    published = _published_count(published_corpus, production_day_id=day_id)\n''',
              '''    published = count_reconciled_published_articles(\n        published_corpus, production_day_id=day_id\n    )\n''',
          )
          replace_once(
              path,
              '''    deficit = max(0, BUILD_QUALIFIED_FLOOR - qualified)\n    reason = str(hard_external_block_reason or "").strip() or None\n    if deficit == 0:\n        state = STATE_FLOOR_MET\n        reason = None\n    elif reason:\n        state = STATE_HARD_EXTERNAL_BLOCK\n    elif bounded_useful_universe_exhausted or remaining == 0:\n        state = STATE_DEGRADED_DAILY_OUTPUT_DEFICIT\n    elif qualified >= used:\n        state = STATE_ON_TRACK\n    else:\n        state = STATE_DEFICIT_RECOVERABLE\n''',
              '''    deficit = max(0, BUILD_QUALIFIED_FLOOR - qualified)\n    published_deficit = max(0, FINAL_PUBLISHED_TARGET_MIN - published)\n    reason = str(hard_external_block_reason or "").strip() or None\n    if published_deficit == 0:\n        state = STATE_FLOOR_MET\n        reason = None\n    elif reason:\n        state = STATE_HARD_EXTERNAL_BLOCK\n    elif bounded_useful_universe_exhausted or remaining == 0:\n        state = STATE_DEGRADED_DAILY_OUTPUT_DEFICIT\n    elif published >= used:\n        state = STATE_ON_TRACK\n    else:\n        state = STATE_DEFICIT_RECOVERABLE\n''',
          )

          # Persistent Simple scheduler: one strict canonical accounting read BEFORE slot capacity.
          path = 'live_contentops/v1_simple_gemini_scheduler_v1.py'
          replace_once(
              path,
              '''    bounded_deficit_work_needed,\n    load_qualified_article_records,\n''',
              '''    LIVE_OUTPUT_COUNT_BASIS,\n    bounded_deficit_work_needed,\n    count_reconciled_published_articles,\n    load_qualified_article_records,\n''',
          )
          replace_once(
              path,
              '''            "published_memory_refresh_count": 0,\n            "gemini_logical_call_count": 0,\n''',
              '''            "published_memory_refresh_count": 0,\n            "published_accounting_refresh_count": 0,\n            "published_articles_before_window": None,\n            "live_output_count_basis": LIVE_OUTPUT_COUNT_BASIS,\n            "gemini_logical_call_count": 0,\n''',
          )
          replace_once(
              path,
              '''        qualified_before_window = len(\n            load_qualified_article_records(\n                self.scheduler_root,\n                production_day_id=production_day_id,\n            )\n        )\n        slot_capacity = int(\n            existing_window.get("slot_capacity")\n            or bounded_deficit_work_needed(\n                session=session,\n                qualified_articles_today=qualified_before_window,\n            )\n        )\n''',
              '''        canonical_before_window, canonical_accounting_proof = self._published_memory_loader()\n        report["published_accounting_refresh_count"] += 1\n        published_before_window = count_reconciled_published_articles(\n            canonical_before_window, production_day_id=production_day_id\n        )\n        report["published_articles_before_window"] = published_before_window\n        qualified_before_window = len(\n            load_qualified_article_records(\n                self.scheduler_root,\n                production_day_id=production_day_id,\n            )\n        )\n        slot_capacity = int(\n            existing_window.get("slot_capacity")\n            or bounded_deficit_work_needed(\n                session=session,\n                published_articles_today=published_before_window,\n            )\n        )\n''',
          )
          replace_once(
              path,
              '''            "slot_capacity": slot_capacity,\n            "state": "RUNNING",\n''',
              '''            "slot_capacity": slot_capacity,\n            "qualified_articles_before_window": qualified_before_window,\n            "published_articles_before_window": published_before_window,\n            "live_output_count_basis": LIVE_OUTPUT_COUNT_BASIS,\n            "canonical_published_accounting_proof": dict(canonical_accounting_proof),\n            "state": "RUNNING",\n''',
          )

          # Legacy Final Daily App compatibility path must use the same live published basis.
          path = 'live_contentops/daily_app_supervisor_v1.py'
          replace_once(
              path,
              '''                    qualified_articles_today=production_before.qualified_articles_today,\n''',
              '''                    published_articles_today=production_before.published_articles_today,\n''',
          )
          replace_once(
              path,
              '''            result["production_day_deficit_before"] = (\n                production_before.remaining_build_deficit\n            )\n            result["production_day_deficit_after"] = (\n                production_after.remaining_build_deficit\n            )\n''',
              '''            result["production_day_deficit_before"] = (\n                production_before.remaining_published_deficit\n            )\n            result["production_day_deficit_after"] = (\n                production_after.remaining_published_deficit\n            )\n            result["production_day_qualified_deficit_before"] = (\n                production_before.remaining_build_deficit\n            )\n            result["production_day_qualified_deficit_after"] = (\n                production_after.remaining_build_deficit\n            )\n            result["production_day_live_output_count_basis"] = (\n                production_before.live_output_count_basis\n            )\n''',
          )

          # Existing scheduler regressions: active window now performs one extra strict published
          # accounting read; zero published output no longer gets masked by qualified telemetry.
          path = 'tests/test_v1_simple_gemini_scheduler_v1.py'
          replace_once(path, 'assert len(memory_calls) == 2\n', 'assert len(memory_calls) == 3\n')
          replace_once(
              path,
              '''    assert result["slot_capacity"] == 3\n    assert result["simple_operation_invocation_count"] == 3\n    assert len(load_qualified_article_records(tmp_path, production_day_id=day_id)) == 4\n''',
              '''    assert result["slot_capacity"] == 4\n    assert result["simple_operation_invocation_count"] == 4\n    assert result["published_articles_before_window"] == 0\n    assert len(load_qualified_article_records(tmp_path, production_day_id=day_id)) == 5\n''',
          )
          PY

      - name: Add focused accounting regressions
        shell: bash
        run: |
          cat > tests/test_v1_reconciled_published_count_accounting_v1.py <<'PY'
          from __future__ import annotations

          from pathlib import Path

          from live_contentops.editorial_portfolio_v1 import PublishedArticleRef
          from live_contentops.newsroom_production_day_v1 import (
              LIVE_OUTPUT_COUNT_BASIS,
              STATE_DEFICIT_RECOVERABLE,
              STATE_FLOOR_MET,
              bounded_deficit_work_needed,
              build_current_zero_write_qualified_article_record,
              build_production_day_snapshot,
              newsroom_production_day_id,
              persist_qualified_article_record,
          )
          from live_contentops.published_corpus_read_model_v1 import (
              CANONICAL_PUBLICATION_CONTRACT,
              is_countable_canonical_published_article,
          )
          from live_contentops.v1_simple_gemini_scheduler_v1 import SimpleGeminiLocalScheduler

          REFERENCE = "2026-08-28T16:00:00Z"


          def _published(index: int, *, published_at: str = REFERENCE) -> PublishedArticleRef:
              return PublishedArticleRef(
                  story_identity=f"published-story-{index}",
                  title=f"Published story {index}",
                  published_at_utc=published_at,
                  public_object_id=f"substack-post-{index}",
                  canonical_url_hash=f"hash-{index}",
                  content_hash=None,
                  entities=(),
                  update_chain_identity=f"published-story-{index}",
                  article_mode="BREAKING_BRIEF",
                  article_identity=f"published-article-{index}",
                  canonical_url=f"https://capitalchronicle.substack.com/p/published-{index}",
                  source_work_item_id=f"work-{index}",
              )


          def _qualified(root: Path, index: int) -> None:
              article = {
                  "title": f"Qualified {index}",
                  "substack_body_markdown": f"Qualified body {index}",
              }
              record = build_current_zero_write_qualified_article_record(
                  production_day_id=newsroom_production_day_id(REFERENCE),
                  parent_window_id=f"window-{index}",
                  attempt_run_id=f"attempt-{index}",
                  article=article,
                  story_identity=f"qualified-story-{index}",
                  update_chain_identity=f"qualified-story-{index}",
                  resolved_article_mode="BREAKING_BRIEF",
                  accepted_evidence_documents=[
                      {
                          "document_id": f"doc-{index}",
                          "source_url": f"https://example.com/{index}",
                          "canonical_content_sha256": "a" * 64,
                          "published_at_utc": REFERENCE,
                          "published_at_source": "CONTROLLED",
                      }
                  ],
                  editorial_provider="9router",
                  editorial_model="vx/gemini-3.5-flash(high)",
                  editorial_reasoning_effort="HIGH",
                  logical_model_invocation_count=2,
                  derivative_package_intents=[],
              )
              persist_qualified_article_record(root / f"qualified-{index}", record)


          def test_four_qualified_zero_published_is_not_live_floor_met(tmp_path):
              for index in range(4):
                  _qualified(tmp_path, index)
              snapshot = build_production_day_snapshot(
                  reference=REFERENCE,
                  output_root=tmp_path,
                  published_corpus=[],
                  routine_opportunities_used_override=3,
              )
              assert snapshot.qualified_articles_today == 4
              assert snapshot.published_articles_today == 0
              assert snapshot.remaining_build_deficit == 0
              assert snapshot.remaining_published_deficit == 5
              assert snapshot.production_day_state == STATE_DEFICIT_RECOVERABLE
              assert snapshot.live_output_count_basis == CANONICAL_PUBLICATION_CONTRACT
              assert snapshot.to_dict()["remaining_published_deficit"] == 5


          def test_five_strict_canonical_publications_meet_live_floor_without_using_qualified_count(tmp_path):
              snapshot = build_production_day_snapshot(
                  reference=REFERENCE,
                  output_root=tmp_path,
                  published_corpus=[_published(index) for index in range(5)],
                  routine_opportunities_used_override=4,
              )
              assert snapshot.qualified_articles_today == 0
              assert snapshot.remaining_build_deficit == 4
              assert snapshot.published_articles_today == 5
              assert snapshot.remaining_published_deficit == 0
              assert snapshot.production_day_state == STATE_FLOOR_MET
              assert snapshot.live_output_count_basis == LIVE_OUTPUT_COUNT_BASIS


          def test_partial_or_noncanonical_projection_cannot_enter_live_count(tmp_path):
              valid = _published(1)
              invalid_url = PublishedArticleRef(
                  **{
                      **valid.__dict__,
                      "article_identity": "invalid-url",
                      "canonical_url": "https://example.com/p/not-canonical",
                  }
              )
              missing_work_item = PublishedArticleRef(
                  **{
                      **valid.__dict__,
                      "article_identity": "missing-work-item",
                      "source_work_item_id": None,
                  }
              )
              assert is_countable_canonical_published_article(valid) is True
              assert is_countable_canonical_published_article(invalid_url) is False
              assert is_countable_canonical_published_article(missing_work_item) is False
              snapshot = build_production_day_snapshot(
                  reference=REFERENCE,
                  output_root=tmp_path,
                  published_corpus=[valid, invalid_url, missing_work_item],
                  routine_opportunities_used_override=1,
              )
              assert snapshot.published_articles_today == 1
              assert snapshot.remaining_published_deficit == 4


          def test_deficit_capacity_uses_published_count_not_qualified_telemetry():
              assert bounded_deficit_work_needed(
                  session="new_york_2300_bangkok", published_articles_today=0
              ) == 4
              assert bounded_deficit_work_needed(
                  session="new_york_2300_bangkok", published_articles_today=2
              ) == 2
              assert bounded_deficit_work_needed(
                  session="new_york_2300_bangkok", published_articles_today=5
              ) == 1


          def test_simple_scheduler_uses_strict_published_memory_for_slot_capacity(tmp_path):
              published = [_published(1), _published(2)]
              memory_calls: list[int] = []
              semantic_calls: list[str] = []

              def memory_loader():
                  memory_calls.append(1)
                  return published, {
                      "schema_version": "contentops.v1_simple_published_memory_access.v1",
                      "canonical_reconciled_article_count": 2,
                      "canonical_publication_contract": CANONICAL_PUBLICATION_CONTRACT,
                      "derived_from_existing_durable_truth": True,
                      "store_access_mode": "SQLITE_MODE_RO_QUERY_ONLY",
                      "auto_migrate": False,
                      "production_store_unchanged_during_projection": True,
                      "second_publication_store_created": False,
                  }

              def abstain(**kwargs):
                  semantic_calls.append(kwargs["run_id"])
                  return {
                      "classification": "NO_PUBLICATION",
                      "exact_next_blocker": "CONTROLLED_ABSTENTION",
                      "candidate_count": 32,
                      "candidate_limit": 32,
                      "source_request_count": 0,
                      "logical_model_invocation_count": 1,
                      "provider_attempt_count": 1,
                      "revision_performed": False,
                      "codex_runtime_model_call_count": 0,
                      "public_write_performed": False,
                      "provider_publication_writes": 0,
                      "unknown_write_count": 0,
                  }

              scheduler = SimpleGeminiLocalScheduler(
                  scheduler_root=tmp_path,
                  simple_operation=abstain,
                  published_memory_loader=memory_loader,
              )
              result = scheduler.tick(now=REFERENCE)
              assert result["session"] == "new_york_2300_bangkok"
              assert result["published_articles_before_window"] == 2
              assert result["published_accounting_refresh_count"] == 1
              assert result["slot_capacity"] == 2
              assert len(semantic_calls) == 2
              assert len(memory_calls) == 3
          PY

      - name: Commit explicit paths
        shell: bash
        run: |
          git config user.name 'contentops-ci'
          git config user.email 'contentops-ci@users.noreply.github.com'
          git add live_contentops/published_corpus_read_model_v1.py
          git add live_contentops/newsroom_production_day_v1.py
          git add live_contentops/v1_simple_gemini_scheduler_v1.py
          git add live_contentops/daily_app_supervisor_v1.py
          git add tests/test_v1_simple_gemini_scheduler_v1.py
          git add tests/test_v1_reconciled_published_count_accounting_v1.py
          git diff --check --cached
          git commit -m 'fix(v1): count reconciled canonical publications for live output'
          git push origin HEAD:agent/web-v1-reconciled-published-count-accounting-v1
