name: pr30-one-shot-telemetry-truth

on:
  push:
    branches:
      - agent/v1-llm-first-selected-source-hydration-economics-v1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact telemetry truth patch
        run: python scripts/one_shot_pr30_telemetry_truth_correction.py
      - name: Compile
        run: python -m compileall -q live_contentops scripts tests/test_native_llm_first_daily_app_supervisor_v1.py
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest pillow
      - name: Run PR30 regressions
        run: python -m pytest -q tests/test_native_llm_first_daily_app_supervisor_v1.py
      - name: Diff hygiene
        run: git diff --check
      - name: Commit and remove one-shot machinery
        shell: bash
        run: |
          git config user.name 'contentops-ci'
          git config user.email 'contentops-ci@users.noreply.github.com'
          git add live_contentops/native_llm_first_daily_app_supervisor_v1.py tests/test_native_llm_first_daily_app_supervisor_v1.py
          git rm scripts/one_shot_pr30_telemetry_truth_correction.py .github/workflows/pr30-one-shot-telemetry-truth.yml
          git diff --cached --check
          git commit -m 'fix(v1): report narrowed native shortlist telemetry truthfully'
          git push origin HEAD:agent/v1-llm-first-selected-source-hydration-economics-v1
