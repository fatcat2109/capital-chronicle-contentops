name: ci-fast

on:
  push:
    branches:
      - master
      - 'agent/web-**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile canonical Python sources
        run: python -m compileall -q live_contentops scripts

      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check pytest pillow python-dotenv jsonschema matplotlib==3.10.0 playwright

      - name: Run deterministic CodeGraph generator tests
        run: python -m pytest -q tests/test_codex_context_index.py

      - name: Run retained Speech Highlight Relay and CLI boundary tests
        run: python -m pytest -q tests/test_speech_highlight_relay_v1.py tests/test_cli.py

      - name: Verify private X-list Main permission boundaries and cursor recovery
        run: python -m pytest -q tests/test_x_list_private_main_permission_v1.py

      - name: Verify scheduled window terminal reporting and one-attempt delivery
        run: python -m pytest -q tests/test_native_window_result_reporting_v1.py

      - name: Run LLM-first Phase A focused tests
        run: python -m pytest -q tests/test_llm_first_validate_after_v1.py

      - name: Run Main latest-report consumer controls and exact-byte readback
        run: python -m pytest -q tests/test_capital_chronicle_latest_report_consumer_v1.py tests/test_capital_chronicle_legacy_parent_recovery_v1.py tests/test_public_research_semantics_v1.py tests/test_capital_chronicle_report_editorial_workspace_v1.py tests/test_capital_chronicle_report_feed_v1.py tests/test_capital_chronicle_public_manifest_v1.py tests/test_contentops_main_headline_projection_v1.py tests/test_contentops_main_intake_export_v1.py tests/test_contentops_continuous_intelligence_realign_v1.py tests/test_contentops_source_research_v1.py tests/test_contentops_foundation_library_v1.py tests/test_contentops_editorial_desk_v1.py

      - name: Run LLM-first Phase B runtime-repair regressions
        shell: bash
        run: |
          python -m pytest -q tests/test_official_codex_provider_v1.py -k "dynamic_web_run or non_web_dynamic_tool"
          python -m pytest -q tests/test_rolling_x_grounded_article_media_builder_v1.py -k "llm_first_exact_claim_validation or writer_validator_rejects_uncovered_connective_paragraph or epistemic_transport_handle"
          python -m pytest -q tests/test_run_v1_llm_first_single_article_canary_v1.py

      - name: Run V1 simple Gemini reset regressions
        shell: bash
        run: |
          python -m pytest -q tests/test_browser_rendered_source_recovery_v1.py tests/test_public_secondary_evidence_loader_v1.py
          python -m pytest -q tests/test_run_v1_simple_gemini_newsroom_cli_v1.py
          python -m pytest -q tests/test_v1_simple_gemini_newsroom_v1.py
          python -m pytest -q tests/test_v1_simple_gemini_scheduler_v1.py
          python -m pytest -q tests/test_v1_simple_gemini_scheduler_process_v1.py
          python -m pytest -q tests/test_v1_simple_durable_publication_bridge_v1.py
          python -m pytest -q tests/test_v1_simple_routine_publication_handoff_v1.py
          python -m pytest -q tests/test_v1_simple_publication_handoff_recovery_v1.py
          python -m pytest -q tests/test_v1_reconciled_published_count_accounting_v1.py
          python -m pytest -q tests/test_newsroom_production_day_v1.py
          python -m pytest -q tests/test_canonical_production_entrypoint_and_legacy_quarantine_v1.py
          python -m pytest -q tests/test_nine_router_ordered_model_router_v2.py tests/test_nine_router_provider_adapter_and_preflight_v2.py
          python -m pytest -q tests/test_publication_coordinator_v1.py tests/test_controlled_no_write_reconciliation_v1.py tests/test_daily_app_kill_switch_housekeeping_v1.py tests/test_native_volume_window_v1.py tests/test_native_brief_windows_v1.py tests/test_native_photoless_briefs_v1.py
          python -m pytest -q tests/test_codex_desktop_newsroom_operator_v1.py
          python -m pytest -q tests/test_contentops_emergency_stop_v1.py

      - name: Install canonical UI dependencies for rendered reader contracts
        run: npm ci --prefix ui/contentops_v5 --no-audit --no-fund

      - name: Validate native Desktop owner, live activation and safety contracts
        # Terminal refusals must remain independent of positive article/media gates.
        run: python -m pytest -q tests/test_native_pre_writer_outcomes_v1.py tests/test_native_selected_story_context_v1.py tests/test_native_final_visual_review_v1.py tests/test_native_live_launch_v1.py tests/test_native_desktop_editorial_v1.py tests/test_native_scheduled_continuity_v1.py tests/test_native_newsroom_owner_operation_v1.py tests/test_native_headline_filter_v1.py tests/test_native_neo_executor_v1.py tests/test_native_desktop_publication_v1.py tests/test_native_newsroom_learning_v1.py tests/test_daily_app_performance_learning_v1.py tests/test_daily_app_ui_read_model_v1.py tests/test_daily_app_operator_trigger_v1.py tests/test_contentops_profile_continuity_lock_v1.py tests/test_dated_distribution_recovery_v1.py tests/test_linkedin_neo_recovery_v1.py tests/test_reader_attribution_timezone_policy_v1.py tests/test_reader_presentation_revision_v1.py tests/test_reader_first_data_journalism_v1.py

      - name: Check CodeGraph freshness and prepare repair artifact
        id: codegraph
        shell: bash
        run: |
          set +e
          python scripts/generate_codex_context_index.py --check 2>&1 | tee codegraph-check.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            python scripts/generate_codex_context_index.py
          fi

      - name: Upload CodeGraph evidence
        uses: actions/upload-artifact@v4
        with:
          name: codegraph-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            codegraph-check.txt
            docs/codegraph/INDEX.md
            docs/codegraph/V2_CONTEXT.md
            docs/codegraph/graph.json
          if-no-files-found: error
          retention-days: 7

      - name: Check branch diff hygiene
        shell: bash
        run: |
          git fetch --no-tags origin master
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/master" ]; then
            base="${{ github.event.before }}"
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="$(git rev-parse HEAD^)"
            fi
          else
            base="$(git merge-base HEAD origin/master)"
          fi
          git diff --check "$base" HEAD

      - name: Enforce committed CodeGraph freshness
        if: always() && steps.codegraph.outputs.rc != '0' && (github.event_name != 'push' || github.ref != 'refs/heads/master')
        shell: bash
        run: |
          echo 'Committed CodeGraph is stale; commit the generated artifact bytes and rerun.'
          exit 1

  branch-codegraph-refresh:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/agent/web-')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Generate exact CodeGraph bytes when stale
        id: refresh
        shell: bash
        run: |
          set +e
          python scripts/generate_codex_context_index.py --check
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            python scripts/generate_codex_context_index.py
          fi

      - name: Commit only generated CodeGraph outputs
        if: steps.refresh.outputs.rc != '0'
        shell: bash
        run: |
          git config user.name 'contentops-ci'
          git config user.email 'contentops-ci@users.noreply.github.com'
          git add docs/codegraph/INDEX.md docs/codegraph/V2_CONTEXT.md docs/codegraph/graph.json
          if git diff --cached --quiet; then
            echo 'No generated CodeGraph changes to commit.'
            exit 0
          fi
          git commit -m 'chore: refresh CodeGraph for integration source epoch'
          git push origin HEAD:"${TARGET_BRANCH}"
