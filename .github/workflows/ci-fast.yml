name: ci-fast

on:
  push:
    branches:
      - 'agent/web-**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile canonical Python sources
        run: python -m compileall -q live_contentops scripts

      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run deterministic CodeGraph generator tests
        run: python -m pytest -q tests/test_codex_context_index.py

      - name: Validate hybrid execution authority candidate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          agents = Path('AGENTS.md').read_text(encoding='utf-8')
          authority_map = Path('docs/automation/CONTENTOPS_CURRENT_AUTHORITY_AND_SUPERSESSION_MAP_V1.md').read_text(encoding='utf-8')
          policy = Path('docs/automation/CONTENTOPS_CAPABILITY_ROUTED_HYBRID_EXECUTION_POLICY_V1.md').read_text(encoding='utf-8')

          assert 'Current repository execution framework is `CAPABILITY_ROUTED_HYBRID`.' in agents
          assert 'CONTENTOPS_CAPABILITY_ROUTED_HYBRID_EXECUTION_POLICY_V1.md' in agents
          assert '## EXECUTION ROUTING SUPERSESSION' in authority_map
          assert '`WEB_STATIC`' in authority_map and '`WEB_CI`' in authority_map
          assert '`CODEX_EXECUTION`' in authority_map and '`OWNER_GATED_EXTERNAL`' in authority_map
          assert 'Status: `OWNER_AUTHORIZED_EXECUTION_POLICY_CANDIDATE`' in policy
          assert 'no merge without explicit owner authorization' in policy
          PY

      - name: Check CodeGraph freshness and prepare repair artifact
        id: codegraph
        shell: bash
        run: |
          set +e
          python scripts/generate_codex_context_index.py --check 2>&1 | tee codegraph-check.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            python scripts/generate_codex_context_index.py
          fi

      - name: Upload CodeGraph evidence
        uses: actions/upload-artifact@v4
        with:
          name: codegraph-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            codegraph-check.txt
            docs/codegraph/INDEX.md
            docs/codegraph/V2_CONTEXT.md
            docs/codegraph/graph.json
          if-no-files-found: error
          retention-days: 7

      - name: Check branch diff hygiene
        shell: bash
        run: |
          git fetch --no-tags origin master
          base="$(git merge-base HEAD origin/master)"
          git diff --check "$base" HEAD

      - name: Enforce committed CodeGraph freshness
        if: always() && steps.codegraph.outputs.rc != '0'
        shell: bash
        run: |
          echo 'Committed CodeGraph is stale; commit the generated artifact bytes and rerun.'
          exit 1

  branch-hybrid-policy-anchor-refresh:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/web-contentops-p0-hybrid-integration-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Patch hybrid policy into CodeGraph authority contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          policy = 'docs/automation/CONTENTOPS_CAPABILITY_ROUTED_HYBRID_EXECUTION_POLICY_V1.md'
          generator_path = Path('scripts/generate_codex_context_index.py')
          tests_path = Path('tests/test_codex_context_index.py')

          generator = generator_path.read_text(encoding='utf-8')
          tests = tests_path.read_text(encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one target, found {count}')
              return text.replace(old, new, 1)

          generator = replace_once(
              generator,
              'GENERATOR_VERSION = "2.3.0"',
              'GENERATOR_VERSION = "2.4.0"',
              'generator_version',
          )
          generator = replace_once(
              generator,
              '    "docs/automation/CONTENTOPS_CURRENT_AUTHORITY_AND_SUPERSESSION_MAP_V1.md",\n'
              '    "docs/automation/CONTENTOPS_FINAL_PRODUCT_NORTH_STAR_V3.md",',
              '    "docs/automation/CONTENTOPS_CURRENT_AUTHORITY_AND_SUPERSESSION_MAP_V1.md",\n'
              f'    "{policy}",\n'
              '    "docs/automation/CONTENTOPS_FINAL_PRODUCT_NORTH_STAR_V3.md",',
              'authority_docs',
          )
          generator = replace_once(
              generator,
              '''3. `docs/automation/CONTENTOPS_CURRENT_AUTHORITY_AND_SUPERSESSION_MAP_V1.md`
4. `docs/automation/CONTENTOPS_FINAL_PRODUCT_NORTH_STAR_V3.md`
5. `docs/automation/CONTENTOPS_FINAL_PRODUCT_MASTER_PLAN_V3.md`
6. this V2 map or curated `docs/codegraph/V1_CONTEXT.md`
7. the appropriate current lane pointer
8. the nearest scoped `AGENTS.md`
9. exact implementation, tests, and evidence''',
              '''3. `docs/automation/CONTENTOPS_CURRENT_AUTHORITY_AND_SUPERSESSION_MAP_V1.md`
4. `docs/automation/CONTENTOPS_CAPABILITY_ROUTED_HYBRID_EXECUTION_POLICY_V1.md`
5. `docs/automation/CONTENTOPS_FINAL_PRODUCT_NORTH_STAR_V3.md`
6. `docs/automation/CONTENTOPS_FINAL_PRODUCT_MASTER_PLAN_V3.md`
7. this V2 map or curated `docs/codegraph/V1_CONTEXT.md`
8. the appropriate current lane pointer
9. the nearest scoped `AGENTS.md`
10. exact implementation, tests, and evidence''',
              'v2_context_read_path',
          )
          generator = replace_once(
              generator,
              '''        "3. `docs/automation/CONTENTOPS_CURRENT_AUTHORITY_AND_SUPERSESSION_MAP_V1.md`",
        "4. `docs/automation/CONTENTOPS_FINAL_PRODUCT_NORTH_STAR_V3.md`",
        "5. `docs/automation/CONTENTOPS_FINAL_PRODUCT_MASTER_PLAN_V3.md`",
        "6. `docs/codegraph/V1_CONTEXT.md` or `docs/codegraph/V2_CONTEXT.md`",
        "7. the appropriate current V1/V2 lane pointer",
        "8. nearest scoped `AGENTS.md`",
        "9. exact implementation, focused tests, and task evidence",''',
              '''        "3. `docs/automation/CONTENTOPS_CURRENT_AUTHORITY_AND_SUPERSESSION_MAP_V1.md`",
        "4. `docs/automation/CONTENTOPS_CAPABILITY_ROUTED_HYBRID_EXECUTION_POLICY_V1.md`",
        "5. `docs/automation/CONTENTOPS_FINAL_PRODUCT_NORTH_STAR_V3.md`",
        "6. `docs/automation/CONTENTOPS_FINAL_PRODUCT_MASTER_PLAN_V3.md`",
        "7. `docs/codegraph/V1_CONTEXT.md` or `docs/codegraph/V2_CONTEXT.md`",
        "8. the appropriate current V1/V2 lane pointer",
        "9. nearest scoped `AGENTS.md`",
        "10. exact implementation, focused tests, and task evidence",''',
              'index_read_path',
          )
          generator = replace_once(
              generator,
              '        "docs/automation/CONTENTOPS_CURRENT_AUTHORITY_AND_SUPERSESSION_MAP_V1.md",\n'
              '        "docs/automation/CONTENTOPS_FINAL_PRODUCT_NORTH_STAR_V3.md",',
              '        "docs/automation/CONTENTOPS_CURRENT_AUTHORITY_AND_SUPERSESSION_MAP_V1.md",\n'
              f'        "{policy}",\n'
              '        "docs/automation/CONTENTOPS_FINAL_PRODUCT_NORTH_STAR_V3.md",',
              'required_authority_anchors',
          )

          tests = replace_once(
              tests,
              '    assert "CONTENTOPS_CURRENT_AUTHORITY_AND_SUPERSESSION_MAP_V1.md" in generated\n'
              '    assert "CONTENTOPS_FINAL_PRODUCT_NORTH_STAR_V3.md" in generated',
              '    assert "CONTENTOPS_CURRENT_AUTHORITY_AND_SUPERSESSION_MAP_V1.md" in generated\n'
              '    assert "CONTENTOPS_CAPABILITY_ROUTED_HYBRID_EXECUTION_POLICY_V1.md" in generated\n'
              '    assert "CONTENTOPS_FINAL_PRODUCT_NORTH_STAR_V3.md" in generated',
              'index_policy_assertion',
          )
          tests = replace_once(
              tests,
              '    assert "CONTENTOPS_CURRENT_AUTHORITY_AND_SUPERSESSION_MAP_V1.md" in normalized\n'
              '    assert "CONTENTOPS_FINAL_PRODUCT_NORTH_STAR_V3.md" in normalized',
              '    assert "CONTENTOPS_CURRENT_AUTHORITY_AND_SUPERSESSION_MAP_V1.md" in normalized\n'
              '    assert "CONTENTOPS_CAPABILITY_ROUTED_HYBRID_EXECUTION_POLICY_V1.md" in normalized\n'
              '    assert "CONTENTOPS_FINAL_PRODUCT_NORTH_STAR_V3.md" in normalized',
              'context_policy_assertion',
          )
          tests = replace_once(
              tests,
              'def test_context_contract_paths_exist_and_outputs_have_no_secret_shapes(graph):\n'
              '    assert index.validate_context_contract(graph) == []',
              'def test_context_contract_paths_exist_and_outputs_have_no_secret_shapes(graph):\n'
              '    assert index.validate_context_contract(graph) == []\n'
              f'    assert "{policy}" in graph["authority_anchor_paths"]',
              'graph_policy_anchor_assertion',
          )

          generator_path.write_text(generator, encoding='utf-8', newline='\n')
          tests_path.write_text(tests, encoding='utf-8', newline='\n')
          PY

      - name: Validate patched generator contract
        shell: bash
        run: |
          python -m pytest -q tests/test_codex_context_index.py
          git diff --check -- scripts/generate_codex_context_index.py tests/test_codex_context_index.py

      - name: Commit source contract first
        shell: bash
        run: |
          git config user.name 'contentops-ci'
          git config user.email 'contentops-ci@users.noreply.github.com'
          git add scripts/generate_codex_context_index.py tests/test_codex_context_index.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix: bind hybrid policy into CodeGraph authority'
          fi

      - name: Regenerate from committed source epoch
        shell: bash
        run: |
          python scripts/generate_codex_context_index.py
          python scripts/generate_codex_context_index.py --check
          git add docs/codegraph/INDEX.md docs/codegraph/V2_CONTEXT.md docs/codegraph/graph.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: checkpoint CodeGraph at hybrid policy source epoch'
          fi

      - name: Push bounded source and generated commits
        shell: bash
        run: |
          if [ "$(git rev-parse HEAD)" = "${GITHUB_SHA}" ]; then
            echo 'No hybrid authority anchor changes required.'
            exit 0
          fi
          git push origin HEAD:${GITHUB_REF_NAME}
