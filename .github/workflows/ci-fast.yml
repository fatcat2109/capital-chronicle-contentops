name: ci-fast

on:
  push:
    branches:
      - 'agent/web-**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile canonical Python sources
        run: python -m compileall -q live_contentops scripts

      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run deterministic CodeGraph generator tests
        run: python -m pytest -q tests/test_codex_context_index.py

      - name: Validate current hybrid execution and V1 owner authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          agents = Path('AGENTS.md').read_text(encoding='utf-8')
          authority_map = Path('docs/automation/CONTENTOPS_CURRENT_AUTHORITY_AND_SUPERSESSION_MAP_V1.md').read_text(encoding='utf-8')
          policy = Path('docs/automation/CONTENTOPS_CAPABILITY_ROUTED_HYBRID_EXECUTION_POLICY_V1.md').read_text(encoding='utf-8')
          north_star = Path('docs/automation/CONTENTOPS_FINAL_PRODUCT_NORTH_STAR_V3.md').read_text(encoding='utf-8')
          master_plan = Path('docs/automation/CONTENTOPS_FINAL_PRODUCT_MASTER_PLAN_V3.md').read_text(encoding='utf-8')
          v1_pointer = Path('docs/automation/CONTENTOPS_FINAL_DAILY_APP_V1_CURRENT_EXECUTION_POINTER_V3.md').read_text(encoding='utf-8')
          v2_pointer = Path('docs/automation/CONTENTOPS_V2_RETENTION_NATIVE_VIDEO_FACTORY_CURRENT_EXECUTION_POINTER_V2.md').read_text(encoding='utf-8')
          video_agents = Path('video/AGENTS.md').read_text(encoding='utf-8')
          v2_creative = Path('docs/automation/CONTENTOPS_V2_FREEFORM_CHAPTERIZED_HIGH_XHIGH_OWNER_OVERRIDE_V1.md').read_text(encoding='utf-8')
          pipeline_api = Path('live_contentops/eight_platform_substack_first_pipeline_v1.py').read_text(encoding='utf-8')
          pipeline_impl = Path('live_contentops/_eight_platform_substack_first_pipeline_impl_v1.py').read_text(encoding='utf-8')

          assert 'CAPABILITY_ROUTED_HYBRID' in agents
          assert 'CONTENTOPS_CAPABILITY_ROUTED_HYBRID_EXECUTION_POLICY_V1.md' in agents
          assert '`WEB_STATIC`' in agents and '`WEB_CI`' in agents
          assert '`CODEX_EXECUTION`' in agents and '`OWNER_GATED_EXTERNAL`' in agents
          assert 'Status: `CURRENT_EXECUTION_POLICY`' in policy

          for text in (agents, policy, authority_map):
              normalized = ' '.join(text.lower().split())
              assert 'ordinary reversible repository operations' in normalized
              assert 'new per-operation owner authorization' in normalized
              assert 'normal protected-branch path' in normalized
              assert 'required checks pass' in normalized

          for text in (agents, policy):
              normalized = ' '.join(text.lower().split())
              assert 'bypassing branch protection' in normalized
              assert 'force-push' in normalized
              assert 'public/provider writes' in normalized
              assert 'destructive production/canonical-store' in normalized
              assert 'capital chronicle proprietary/numeric-authority' in normalized
              assert 'v2 public-write authority' in normalized

          assert 'no merge without explicit owner authorization' not in policy
          assert 'merge/push master without explicit owner authorization' not in agents

          for text in (agents, north_star, master_plan):
              upper = text.upper()
              assert '4 QUALIFIED ZERO-PUBLIC-WRITE ARTICLES' in upper
              assert '5–8 PUBLISHED ARTICLES' in upper
              assert 'DEGRADED_DAILY_OUTPUT_DEFICIT' in upper

          for text in (authority_map, v1_pointer):
              assert 'PRODUCTION_QUOTA_ECONOMICS_NOT_ACCEPTED' in text
              assert 'SOURCE_DISCOVERY_REQUIRED' in text
              assert '5–8/day' in text

          assert 'pr #19 provider-resilient quota-efficient batch/tail discovery is accepted and reusable' in v1_pointer.lower()
          assert 'zero-write discovery routing / readiness-persistence correction after calendar proof' in v1_pointer.lower()
          assert 'all four existing routine automations are active on the normalized prompt hash' in v1_pointer.lower()
          assert 'pass_fda_g_scheduled_window_observed' in v1_pointer.lower()
          assert 'fail_routine_output_starvation_policy' in v1_pointer.lower()
          assert 'current_host_runtime_proof_required' not in v1_pointer.lower()
          assert 'native calendar triggering on the current host' in v1_pointer.lower()
          assert 'all four are held paused' not in v1_pointer.lower()
          assert 'Desktop standalone fresh-run Automations are the primary routine V1' in authority_map
          assert 'App Server/SDK provider remains the currently proven' in authority_map
          assert 'no fifth' in authority_map.lower()
          assert 'autonomous_source_discovery_enabled: bool = False' in pipeline_api
          assert 'autonomous_source_discovery_enabled: bool = False' in pipeline_impl
          assert 'UNKNOWN_WRITE' in agents

          assert 'Engineering/repository execution follows root `CAPABILITY_ROUTED_HYBRID`.' in v2_pointer
          assert 'Engineering/repository execution follows root `CAPABILITY_ROUTED_HYBRID`' in video_agents
          assert 'Engineering/repository execution follows the root `CAPABILITY_ROUTED_HYBRID` policy.' in v2_creative
          assert 'Canonical execution framework is `MAIN_CODEX` only.' not in north_star
          assert '`MAIN_CODEX` owns repo/task/orchestration.' not in v2_pointer
          assert '`MAIN_CODEX` owns repo/task orchestration' not in video_agents
          assert '`MAIN_CODEX` owns repo coordination' not in v2_creative
          PY

      - name: Check CodeGraph freshness and prepare repair artifact
        id: codegraph
        shell: bash
        run: |
          set +e
          python scripts/generate_codex_context_index.py --check 2>&1 | tee codegraph-check.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            python scripts/generate_codex_context_index.py
          fi

      - name: Upload CodeGraph evidence
        uses: actions/upload-artifact@v4
        with:
          name: codegraph-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            codegraph-check.txt
            docs/codegraph/INDEX.md
            docs/codegraph/V2_CONTEXT.md
            docs/codegraph/graph.json
          if-no-files-found: error
          retention-days: 7

      - name: Check branch diff hygiene
        shell: bash
        run: |
          git fetch --no-tags origin master
          base="$(git merge-base HEAD origin/master)"
          git diff --check "$base" HEAD

      - name: Enforce committed CodeGraph freshness
        if: always() && steps.codegraph.outputs.rc != '0'
        shell: bash
        run: |
          echo 'Committed CodeGraph is stale; commit the generated artifact bytes and rerun.'
          exit 1

  # Same-repo PRs may repair generated-only CodeGraph drift without consuming a builder session.
  branch-codegraph-refresh:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/agent/web-')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Generate exact CodeGraph bytes when stale
        id: refresh
        shell: bash
        run: |
          set +e
          python scripts/generate_codex_context_index.py --check
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            python scripts/generate_codex_context_index.py
          fi

      - name: Commit only generated CodeGraph outputs
        if: steps.refresh.outputs.rc != '0'
        shell: bash
        run: |
          git config user.name 'contentops-ci'
          git config user.email 'contentops-ci@users.noreply.github.com'
          git add docs/codegraph/INDEX.md docs/codegraph/V2_CONTEXT.md docs/codegraph/graph.json
          if git diff --cached --quiet; then
            echo 'No generated CodeGraph changes to commit.'
            exit 0
          fi
          git commit -m 'chore: refresh CodeGraph for integration source epoch'
          git push origin HEAD:"${TARGET_BRANCH}"
