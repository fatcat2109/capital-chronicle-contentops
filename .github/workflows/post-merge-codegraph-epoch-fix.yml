name: post-merge-codegraph-epoch-fix

on:
  push:
    branches:
      - task/webci-post-merge-codegraph-epoch-v1

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'chore: trigger post-merge CodeGraph epoch fix'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Patch merge-aware source epoch semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          generator_path = Path('scripts/generate_codex_context_index.py')
          tests_path = Path('tests/test_codex_context_index.py')
          generator = generator_path.read_text(encoding='utf-8')
          tests = tests_path.read_text(encoding='utf-8')

          generator = generator.replace(
              'GENERATOR_VERSION = "2.4.0"',
              'GENERATOR_VERSION = "2.5.0"',
              1,
          )

          start = generator.index('def git_head() -> str:\n')
          end = generator.index('\n\ndef source_digest', start)
          new_func = '''def git_head() -> str:
    """Newest commit that changed indexed source, ignoring generated-only and tree-identical merges."""
    try:
        current = subprocess.check_output(
            ["git", "rev-parse", "HEAD"], cwd=ROOT, text=True
        ).strip()
        for _ in range(100):
            parent_line = subprocess.check_output(
                ["git", "rev-list", "--parents", "-n", "1", current],
                cwd=ROOT,
                text=True,
            ).strip().split()
            parents = parent_line[1:]

            if len(parents) > 1:
                current_tree = subprocess.check_output(
                    ["git", "rev-parse", f"{current}^{{tree}}"], cwd=ROOT, text=True
                ).strip()
                matching_parent = None
                for parent in parents:
                    parent_tree = subprocess.check_output(
                        ["git", "rev-parse", f"{parent}^{{tree}}"], cwd=ROOT, text=True
                    ).strip()
                    if parent_tree == current_tree:
                        matching_parent = parent
                        break
                if matching_parent is not None:
                    current = matching_parent
                    continue

            changed = subprocess.check_output(
                [
                    "git", "diff-tree", "--root", "-m", "--no-commit-id", "--name-only",
                    "-r", current,
                ],
                cwd=ROOT,
                text=True,
            ).splitlines()
            if any(name not in GENERATED_PATHS and included(ROOT / name) for name in changed):
                return current
            if not parents:
                return current
            current = parents[0]
        return current
    except (OSError, subprocess.CalledProcessError):
        return "UNKNOWN"
'''
          generator = generator[:start] + new_func + generator[end:]

          marker = 'def test_git_head_skips_tree_identical_merge_commit(monkeypatch):'
          if marker not in tests:
              tests += '''


def test_git_head_skips_tree_identical_merge_commit(monkeypatch):
    merge = "m" * 40
    main_parent = "a" * 40
    branch_parent = "b" * 40
    source_parent = "s" * 40

    def fake_check_output(cmd, cwd=None, text=None):
        if cmd == ["git", "rev-parse", "HEAD"]:
            return merge + "\\n"
        if cmd[:5] == ["git", "rev-list", "--parents", "-n", "1"]:
            current = cmd[-1]
            if current == merge:
                return f"{merge} {main_parent} {branch_parent}\\n"
            if current == branch_parent:
                return f"{branch_parent} {source_parent}\\n"
            raise AssertionError(current)
        if cmd[:2] == ["git", "rev-parse"] and cmd[-1].endswith("^{tree}"):
            commit = cmd[-1][:-7]
            trees = {
                merge: "tree-branch",
                main_parent: "tree-main",
                branch_parent: "tree-branch",
            }
            return trees[commit] + "\\n"
        if cmd[:2] == ["git", "diff-tree"]:
            assert cmd[-1] == branch_parent
            return "live_contentops/relevant.py\\n"
        raise AssertionError(cmd)

    monkeypatch.setattr(index.subprocess, "check_output", fake_check_output)
    assert index.git_head() == branch_parent
'''

          generator_path.write_text(generator, encoding='utf-8', newline='\n')
          tests_path.write_text(tests, encoding='utf-8', newline='\n')
          PY

      - name: Validate source correction
        shell: bash
        run: |
          python -m pytest -q tests/test_codex_context_index.py
          python -m compileall -q scripts
          git diff --check -- scripts/generate_codex_context_index.py tests/test_codex_context_index.py

      - name: Commit source correction
        shell: bash
        run: |
          git config user.name 'contentops-ci'
          git config user.email 'contentops-ci@users.noreply.github.com'
          git add scripts/generate_codex_context_index.py tests/test_codex_context_index.py
          git commit -m 'fix: make CodeGraph source epoch merge-aware'

      - name: Remove one-time workflow before final generation
        shell: bash
        run: |
          git rm .github/workflows/post-merge-codegraph-epoch-fix.yml
          git commit -m 'chore: remove one-time CodeGraph epoch fixer'

      - name: Regenerate and verify final CodeGraph
        shell: bash
        run: |
          python scripts/generate_codex_context_index.py
          python scripts/generate_codex_context_index.py --check
          git add docs/codegraph/INDEX.md docs/codegraph/V2_CONTEXT.md docs/codegraph/graph.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: checkpoint CodeGraph at merge-aware source epoch'
          fi
          python -m pytest -q tests/test_codex_context_index.py
          git diff --check origin/master...HEAD

      - name: Push bounded correction
        run: git push origin HEAD:task/webci-post-merge-codegraph-epoch-v1
