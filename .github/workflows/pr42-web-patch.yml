name: pr42-web-correction-patch

on:
  push:
    branches:
      - 'codex/v1-simple-to-durable-publication-bridge-v1'

permissions:
  contents: write

concurrency:
  group: pr42-web-correction-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/v1-simple-to-durable-publication-bridge-v1

      - name: Apply exact bounded replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          test_path = 'tests/test_v1_simple_gemini_scheduler_v1.py'
          old_test = '''def test_scheduler_source_contains_no_codex_automation_or_publication_dispatch_route():
              source = Path("live_contentops/v1_simple_gemini_scheduler_v1.py").read_text(
                  encoding="utf-8"
              )
              assert "codex_desktop_newsroom_operator_v1" not in source
              assert "DurablePublicationCoordinator" not in source
              assert "scheduler_v6" not in source
              assert "fast_one_cycle" not in source'''
          new_test = '''def test_scheduler_source_contains_no_codex_automation_or_direct_publication_owner():
              source = Path("live_contentops/v1_simple_gemini_scheduler_v1.py").read_text(
                  encoding="utf-8"
              )
              assert "codex_desktop_newsroom_operator_v1" not in source
              assert "from live_contentops.publication_coordinator_v1 import" not in source
              assert "DurablePublicationCoordinator(" not in source
              assert "publication_handoff" in source
              assert "scheduler_v6" not in source
              assert "fast_one_cycle" not in source'''
          replace_once(test_path, old_test, new_test)

          process_path = 'live_contentops/v1_simple_gemini_scheduler_process_v1.py'
          replace_once(
              process_path,
              '''This module owns process lifecycle only. It never schedules editorial work, reads credentials,
          opens the publication store, calls a model/source/provider, or crosses a public-write boundary.''',
              '''This module owns process lifecycle only. It never schedules editorial work, reads credentials,
          calls a model/source/provider, or performs a public write itself. The child scheduler may delegate a
          qualified zero-write Simple result to the existing durable publication coordinator under current V1
          authority; publication truth remains coordinator/store-owned.''',
          )
          p = Path(process_path)
          text = p.read_text(encoding='utf-8')
          old = '"public_write_authority": "ZERO"'
          if text.count(old) != 2:
              raise SystemExit(f'{process_path}: expected 2 public_write_authority ZERO markers, found {text.count(old)}')
          text = text.replace(
              old,
              '"public_write_authority": "DELEGATED_TO_DURABLE_PUBLICATION_COORDINATOR"',
          )
          p.write_text(text, encoding='utf-8', newline='\n')

          workflow_path = '.github/workflows/ci-fast.yml'
          replace_once(
              workflow_path,
              "desktop_code = Path('live_contentops/codex_desktop_newsroom_operator_v1.py').read_text(encoding='utf-8').lower()",
              "desktop_code = Path('live_contentops/codex_desktop_newsroom_operator_v1.py').read_text(encoding='utf-8')",
          )
          PY

      - name: Remove one-shot patch workflow and commit explicit paths
        shell: bash
        run: |
          git config user.name 'contentops-ci'
          git config user.email 'contentops-ci@users.noreply.github.com'
          git rm .github/workflows/pr42-web-patch.yml
          git add tests/test_v1_simple_gemini_scheduler_v1.py
          git add live_contentops/v1_simple_gemini_scheduler_process_v1.py
          git add .github/workflows/ci-fast.yml
          git diff --check --cached
          git commit -m 'fix(v1): align scheduler recovery tests and process truth'
          git push origin HEAD:codex/v1-simple-to-durable-publication-bridge-v1
